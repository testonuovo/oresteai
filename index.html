<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oreste AI - Assistente vocale italiano online gratis</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1b3a;
color:white;
text-align:center;
}

nav{
background:blue;
padding:10px;
display:flex;
justify-content:center;
gap:10px;
}

button{
padding:8px;
border:none;
border-radius:6px;
background:#0071e3;
color:white;
cursor:pointer;
margin:4px;
}

.page{display:none;padding:20px;}
.active{display:block;}

.card{
background:#1e3a8a;
padding:15px;
border-radius:10px;
max-width:500px;
margin:auto;
}

/* AVATAR */
#stage{
display:flex;
justify-content:center;
gap:60px;
margin:10px;
}

.character{
width:120px;
border-radius:50%;
transition:0.3s;
}

.speaking{
transform:scale(1.2);
box-shadow:0 0 20px cyan;
}

/* OS */
#os{
display:none;
position:fixed;
inset:0;
background:#0a2a6b;
padding:10px;
}

.app{display:none;margin-top:10px;}
input,textarea{padding:6px;width:80%;}
</style>
</head>

<body>

<!-- AVATAR -->
<div id="stage">
<img id="oreste" class="character" src="https://i.ibb.co/fzBXJPK1/oreste-ai-avatar.png">
<img id="virus" class="character" src="https://i.ibb.co/wHZ8KG6/logo.jpg">
</div>

<h2>Oreste AI</h2>

<nav>
<button onclick="show('home')">Home</button>
<button onclick="show('ai')">Oreste AI</button>
<button onclick="show('story')">Story</button>
<button onclick="openOS()">OS</button>
</nav>

<!-- HOME -->
<div id="home" class="page active">
<div class="card">
<h3>Sistema attivo</h3>
<p>AI + OS stabile</p>
</div>
</div>

<!-- AI -->
<div id="ai" class="page">
<div class="card">
<h3>Assistente</h3>
<input id="input" placeholder="scrivi o parla">
<br>
<button onclick="ask()">Invia</button>
<button onclick="voice()">🎤 Voce</button>
</div>
</div>

<!-- STORY -->
<div id="story" class="page">
<div class="card">
<h3>Story</h3>
<p id="storyText">Premi avanti</p>
<button onclick="nextStory()">Avanti</button>
</div>
</div>

<!-- OS -->
<div id="os">

<h3>Oreste OS</h3>

<button onclick="app('calc')">Calcolatrice</button>
<button onclick="app('browser')">Oreste OS browser</button>
<button onclick="app('antivirus')">Antivirus</button>
<button onclick="closeOS()">Chiudi</button>

<!-- CALC -->
<div id="calc" class="app">
<input id="a">
<input id="b">
<button onclick="sum()">+</button>
<button onclick="sub()">-</button>
<p id="res"></p>
</div>

<!-- BROWSER -->
<div id="browser" class="app">
<input id="url" placeholder="google.com">
<button onclick="go()">Vai</button>
</div>

<!-- ANTIVIRUS -->
<div id="antivirus" class="app">
<button onclick="scan()">Scansiona</button>
<p id="status"></p>
</div>

</div>

<script>

let i = 0;

/* NAV */
function show(p){
document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
document.getElementById(p).classList.add('active');
}

/* SPEECH + AVATAR */
function speak(t){
speechSynthesis.cancel();

let u = new SpeechSynthesisUtterance(t);
u.lang = "it-IT";

u.onstart = ()=>{
oreste.classList.add("speaking");
virus.classList.add("speaking");
};

u.onend = ()=>{
oreste.classList.remove("speaking");
virus.classList.remove("speaking");
};

speechSynthesis.speak(u);
}

/* AI + HANDLE */
function handle(text){
text = text.toLowerCase();

let r = "";

if(text.includes("ciao")) r = "Ciao! Sono Oreste AI.";
else if(text.includes("chi sei")) r = "Sono il tuo assistente.";
else if(text.includes("ora")) r = new Date().toLocaleTimeString();
else if(text.includes("data")) r = new Date().toLocaleDateString();
else if(text.includes("google")){
window.open("https://www.google.com","_blank");
r = "Apro Google.";
}
else r = "Hai detto: " + text;

speak(r);
}

/* INPUT */
function ask(){
let t = document.getElementById("input").value;
handle(t);
}

/* VOICE */
function voice(){
let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(!SpeechRecognition){
alert("Voice non supportato");
return;
}

let r = new SpeechRecognition();
r.lang = "it-IT";

r.onresult = (e)=>{
let text = e.results[0][0].transcript;
document.getElementById("input").value = text;
handle(text);
};

r.start();
}

/* STORY */
function nextStory(){
let s = [
"Oreste AI si avvia...",
"Analisi sistema...",
"Connessione attiva...",
"Protezione attiva...",
"Sistema stabile"
];

document.getElementById("storyText").innerText = s[i];
speak(s[i]);
i = (i + 1) % s.length;
}

/* OS */
function openOS(){ os.style.display = "block"; }
function closeOS(){ os.style.display = "none"; }

function app(id){
document.querySelectorAll('.app').forEach(a=>a.style.display='none');
document.getElementById(id).style.display='block';
}

/* CALC */
function sum(){
res.innerText = Number(a.value) + Number(b.value);
}

function sub(){
res.innerText = Number(a.value) - Number(b.value);
}

/* BROWSER */
function go(){
let u = url.value;
if(!u.startsWith("http")) u = "https://" + u;
window.open(u,"_blank");
}

/* ANTIVIRUS */
function scan(){
status.innerText = "Scansione...";

setTimeout(()=>{
let r = Math.random()>0.5 ? "Virus rilevato" : "Sistema pulito";
status.innerText = r;
speak(r);
},1200);
}

/* START */
window.onload = ()=>speak("Benvenuto in Oreste AI");

</script>

</body>
</html>
