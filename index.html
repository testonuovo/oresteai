<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Oreste AI è un assistente intelligente creato da Oreste De Chiara. Include OS, Storybook e AI conversazionale.">
<meta name="author" content="Oreste De Chiara">
<meta name="keywords" content="Oreste AI, AI italiana, assistente virtuale, Oreste De Chiara, chatbot italiano">
<title>Oreste AI - Creato da Oreste De Chiara</title>
<style>
body{
margin:0;
font-family:Arial;
background:#0b1b3a;
color:white;
text-align:center;
}

nav{
background:blue;
padding:15px;
display:flex;
justify-content:center;
gap:15px;
align-items:center;
}

nav img{height:35px;}

a{
color:white;
text-decoration:none;
font-weight:bold;
cursor:pointer;
}

.page{display:none;padding:20px;}
.active{display:block;}

.card{
background:blue;
padding:20px;
border-radius:15px;
margin:20px auto;
max-width:500px;
}

button{
padding:10px;
border:none;
border-radius:10px;
background:#0071e3;
color:white;
cursor:pointer;
margin:5px;
}

input, textarea{
padding:10px;
width:80%;
border-radius:10px;
border:none;
margin:5px;
}

#avatar,#avatar2{
width:120px;
border-radius:50%;
}

.speaking{
box-shadow:0 0 25px #00f2ff;
transform:scale(1.05);
}

/* STORY */
.page-turn{
animation:flip 0.5s ease;
}
@keyframes flip{
0%{transform:rotateY(0);}
50%{transform:rotateY(-30deg);}
100%{transform:rotateY(0);}
}

/* OS */
#os{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:blue;
padding:20px;
}

.app{
display:none;
background:#1e3a8a;
padding:20px;
border-radius:10px;
margin-top:10px;
}

/* PERSONAGGI */
#stage{
position:relative;
height:200px;
overflow:hidden;
margin-top:10px;
}

.character{
width:120px;
position:absolute;
top:40px;
left:-150px;
transition:1s ease;
}

.enter{ left:40%; }
.left{ left:-150px; }
.right{ left:120%; }

</style>
</head>

<body>

<!-- STAGE -->
<div id="stage">
<img id="oreste" class="character" src="https://i.ibb.co/fzBXJPK1/oreste-ai-avatar.png">
<img id="virus" class="character" src="https://i.ibb.co/wHZ8KG6/logo.jpg">
</div>

<h1>Oreste AI + OS</h1>

<nav>
<img src="https://i.ibb.co/wHZ8KG6/logo.jpg">
<a onclick="show('home')">Home</a>
<a onclick="show('assistant')">Assistente</a>
<a onclick="show('storybook')">Storybook</a>
<a onclick="openOS()">OS</a>
</nav>

<!-- HOME -->
<div id="home" class="page active">
<div class="card">
<img id="avatar" src="https://i.ibb.co/fzBXJPK1/oreste-ai-avatar.png">
<h2>Oreste AI</h2>
</div>
</div>

<!-- ASSISTENTE -->
<div id="assistant" class="page">
<div class="card">
<img id="avatar2" src="https://i.ibb.co/fzBXJPK1/oreste-ai-avatar.png">
<h2>Assistente</h2>

<input id="input">
<br>
<button onclick="run()">Invia</button>
<button onclick="voice()">🎤 Parla</button>
</div>
</div>

<!-- STORYBOOK -->
<div id="storybook" class="page">
<h3 id="storyChar"></h3>

<div class="card" id="storyCard">
<img id="storyImg" style="width:120px;border-radius:50%;">
<h2 id="storyTitle"></h2>
<p id="storyText"></p>

<div id="choices"></div>

<button onclick="prev()">⬅</button>
<button onclick="next()">➡</button>
</div>
</div>

<!-- OS -->
<div id="os">

<h2>Oreste OS</h2>

<button onclick="showApp('calc')">Calcolatrice</button>
<button onclick="showApp('notes')">Blocco Note</button>
<button onclick="showApp('browser')">Oreste OS Browser</button>
<button onclick="closeOS()">Chiudi</button>

<div id="calc" class="app">
<input id="a">
<input id="b">
<p id="result"></p>
<button onclick="sum()">+</button>
<button onclick="sub()">-</button>
<button onclick="mul()">×</button>
<button onclick="div()">÷</button>
</div>

<div id="notes" class="app">
<textarea id="note"></textarea>
<br>
<button onclick="saveNote()">Salva TXT</button>
<button onclick="loadNote()">Carica</button>
</div>

<div id="browser" class="app">
<input id="url">
<button onclick="go()">Vai</button>
</div>

</div>

<script>

let i = 0;

/* NAV */
function show(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById(p).classList.add("active");

if(p==="storybook"){
i=0;
render();
}
}

/* VOCE */
function speak(text){
speechSynthesis.cancel();
let msg=new SpeechSynthesisUtterance(text);
msg.lang="it-IT";
speechSynthesis.speak(msg);
}

/* PERSONAGGI */
function moveCharacters(scene){
let o=document.getElementById("oreste");
let v=document.getElementById("virus");

o.classList.remove("enter","left","right");
v.classList.remove("enter","left","right");

if(scene==="Risveglio"){
o.classList.add("enter");
v.classList.add("right");
}
if(scene==="Sistema"){
o.classList.add("enter");
v.classList.add("right");
}
if(scene==="Errore"){
o.classList.add("left");
v.classList.add("enter");
}
if(scene==="Battaglia"){
o.classList.add("enter");
v.classList.add("enter");
}
if(scene==="Fine"){
o.classList.add("enter");
v.classList.add("right");
}
}

/* STORY */
const pages=[
{character:"Oreste AI",title:"Risveglio",text:"Mi sto attivando nel sistema.",img:"https://i.ibb.co/fzBXJPK1/oreste-ai-avatar.png",choices:[{t:"Continua",n:1}]},
{character:"Oreste AI",title:"Sistema",text:"Sto analizzando il mondo digitale.",img:"https://i.ibb.co/fzBXJPK1/oreste-ai-avatar.png",choices:[{t:"Avanti",n:2}]},
{character:"Virus",title:"Errore",text:"Qualcosa sta attaccando il sistema!",img:"https://i.ibb.co/wHZ8KG6/logo.jpg",choices:[{t:"Combatti",n:3}]},
{character:"Oreste AI",title:"Battaglia",text:"Sto proteggendo il sistema.",img:"https://i.ibb.co/fzBXJPK1/oreste-ai-avatar.png",choices:[{t:"Vittoria",n:4}]},
{character:"Oreste AI",title:"Fine",text:"Sistema salvato con successo.",img:"https://i.ibb.co/fzBXJPK1/oreste-ai-avatar.png",choices:[{t:"Restart",n:0}]}
];

function render(){

let p = pages[i];

storyChar.innerText=p.character;
storyTitle.innerText=p.title;
storyText.innerText=p.text;
storyImg.src=p.img;

moveCharacters(p.title);

document.getElementById("choices").innerHTML="";
p.choices.forEach(c=>{
let b=document.createElement("button");
b.innerText=c.t;
b.onclick=()=>{i=c.n;render();};
document.getElementById("choices").appendChild(b);
});

speak(p.character+" dice: "+p.text);

let card=document.getElementById("storyCard");
card.classList.remove("page-turn");
void card.offsetWidth;
card.classList.add("page-turn");
}

function next(){if(i<pages.length-1){i++;render();}}
function prev(){if(i>0){i--;render();}}

/* OS FIX */
function openOS(){document.getElementById("os").style.display="block";}
function closeOS(){document.getElementById("os").style.display="none";}

function showApp(a){
document.querySelectorAll(".app").forEach(x=>x.style.display="none");
document.getElementById(a).style.display="block";
}

/* CALC */
function sum(){result.innerText=+a.value + +b.value;}
function sub(){result.innerText=+a.value - +b.value;}
function mul(){result.innerText=+a.value * +b.value;}
function div(){result.innerText=+a.value / +b.value;}

/* NOTE */
function saveNote(){
localStorage.setItem("note",note.value);

const blob=new Blob([note.value],{type:"text/plain"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="nota-oreste.txt";
a.click();
}

function loadNote(){
note.value=localStorage.getItem("note")||"";
}

/* BROWSER */
function go(){
let t=url.value;
if(!t) return;
if(!t.startsWith("http")) t="https://"+t;
window.open(t);
}

/* ASSISTENTE */
function run(){
window.open("https://google.com/search?q="+input.value);
speak("Cerco "+input.value);
}

function voice(){
const SR=window.SpeechRecognition||webkitSpeechRecognition;
const r=new SR();
r.lang="it-IT";
r.onresult=e=>{
input.value=e.results[0][0].transcript;
run();
};
r.start();
}

/* START */
window.onload=()=>speak("Benvenuto in Oreste AI");

</script>

</body>
</html>
