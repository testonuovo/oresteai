<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oreste AI + OS + Storybook</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1b3a;
color:white;
text-align:center;
}

nav{
background:blue;
padding:15px;
display:flex;
justify-content:center;
gap:15px;
align-items:center;
}

nav img{
height:35px;
border:0;
outline:none;
box-shadow:none;
}

a{
color:white;
text-decoration:none;
font-weight:bold;
cursor:pointer;
}

.page{display:none;padding:20px;}
.active{display:block;}

.card{
background:blue;
padding:20px;
border-radius:15px;
margin:20px auto;
max-width:500px;
}

button{
padding:10px;
border:none;
border-radius:10px;
background:#0071e3;
color:white;
cursor:pointer;
margin:5px;
}

input, textarea{
padding:10px;
width:80%;
border-radius:10px;
border:none;
margin:5px;
}

#avatar{
width:140px;
border-radius:50%;
}

.speaking{
box-shadow:0 0 25px #00f2ff;
transform:scale(1.05);
}

/* OS */
#os{
display:none;
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background:blue;
z-index:999;
padding:20px;
}

.app{
display:none;
background:#1e3a8a;
padding:20px;
border-radius:15px;
margin-top:20px;
}
</style>
</head>

<body>

<h1>Oreste AI + OS</h1>

<nav>
<img src="https://i.ibb.co/wHZ8KG6/logo.jpg?v=2">
<a onclick="show('home')">Home</a>
<a onclick="show('assistant')">Assistente</a>
<a onclick="show('storybook')">Storybook</a>
<a onclick="openOS()">OS</a>
</nav>

<!-- HOME -->
<div id="home" class="page active">
<div class="card">
<img id="avatar" src="https://i.ibb.co/fzBXJPK1/oreste-ai-avatar.png">
<h2>Oreste AI</h2>
<p>AI + OS + Storybook</p>
</div>
</div>

<!-- ASSISTENTE -->
<div id="assistant" class="page">
<div class="card">
<img id="avatar2" src="https://i.ibb.co/fzBXJPK1/oreste-ai-avatar.png" style="width:120px;border-radius:50%;">
<h2>Assistente</h2>

<input id="input">
<br>
<button onclick="run()">Invia</button>
<button onclick="voice()">🎤 Parla</button>
<p id="status">Pronto</p>
</div>
</div>

<!-- STORYBOOK -->
<div id="storybook" class="page">
<div class="card">
<img id="storyImg" style="width:120px;border-radius:50%;">
<h2 id="storyTitle"></h2>
<p id="storyText"></p>

<button onclick="prev()">⬅</button>
<button onclick="next()">➡</button>
</div>
</div>

<!-- OS -->
<div id="os">

<h2>Oreste OS</h2>

<button onclick="showApp('calc')">Calcolatrice</button>
<button onclick="showApp('notes')">Blocco Note</button>
<button onclick="closeOS()">Chiudi</button>

<div id="calc" class="app">
<input id="a" placeholder="Numero 1">
<input id="b" placeholder="Numero 2">
<br>
<button onclick="sum()">+</button>
<button onclick="sub()">-</button>
<button onclick="mul()">×</button>
<button onclick="div()">÷</button>
<p id="result"></p>
</div>

<div id="notes" class="app">
<textarea id="note" rows="6"></textarea>
<br>
<button onclick="saveNote()">Salva</button>
<button onclick="loadNote()">Carica</button>
</div>

</div>

<script>

/* NAV */
function show(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById(p).classList.add("active");

if(p === "storybook"){
render();
}
}

/* VOCE */
function speak(text){
speechSynthesis.cancel();

const msg = new SpeechSynthesisUtterance(text);
msg.lang = "it-IT";

const a = document.getElementById("avatar");
const a2 = document.getElementById("avatar2");

msg.onstart = ()=>{
if(a) a.classList.add("speaking");
if(a2) a2.classList.add("speaking");
};

msg.onend = ()=>{
if(a) a.classList.remove("speaking");
if(a2) a2.classList.remove("speaking");
};

speechSynthesis.speak(msg);
}

/* STORYBOOK */
let pages = [
{
title:"Oreste AI",
text:"Tutto nasce da un’idea di creare un assistente intelligente nel browser.",
img:"https://i.ibb.co/fzBXJPK1/oreste-ai-avatar.png"
},
{
title:"Nascita",
text:"Oreste AI prende vita come assistente vocale.",
img:"https://i.ibb.co/fzBXJPK1/oreste-ai-avatar.png"
},
{
title:"Oreste OS",
text:"Un sistema operativo web dentro il browser.",
img:"https://i.ibb.co/wHZ8KG6/logo.jpg"
},
{
title:"Oreste OS Browser",
text:"Navigazione intelligente e comandi vocali.",
img:"https://i.ibb.co/wHZ8KG6/logo.jpg"
}
];

let i = 0;

function render(){
storyTitle.innerText = pages[i].title;
storyText.innerText = pages[i].text;
storyImg.src = pages[i].img;

speak(pages[i].title + ". " + pages[i].text);
}

function next(){
if(i < pages.length - 1){
i++;
render();
}
}

function prev(){
if(i > 0){
i--;
render();
}
}

/* OS */
function openOS(){
os.style.display="block";
autoLoad();
}

function closeOS(){
os.style.display="none";
}

function showApp(a){
document.querySelectorAll(".app").forEach(x=>x.style.display="none");
document.getElementById(a).style.display="block";
}

/* CALC */
function nums(){
return [parseFloat(a.value)||0, parseFloat(b.value)||0];
}

function sum(){let[x,y]=nums();result.innerText=x+y;}
function sub(){let[x,y]=nums();result.innerText=x-y;}
function mul(){let[x,y]=nums();result.innerText=x*y;}
function div(){let[x,y]=nums();result.innerText=y?x/y:"error";}

/* NOTE */
function saveNote(){
localStorage.setItem("oreste_note", note.value);
}

function loadNote(){
note.value = localStorage.getItem("oreste_note") || "";
}

function autoLoad(){
note.value = localStorage.getItem("oreste_note") || "";
}

/* ASSISTENTE */
function run(){handle(input.value);}

function voice(){
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SR){ speak("Non supportato"); return; }

const r = new SR();
r.lang="it-IT";

r.onresult = e=>{
input.value = e.results[0][0].transcript;
handle(input.value);
};

r.start();
}

/* COMANDI */
function handle(t){
t = t.toLowerCase();

if(t.includes("google")){
window.open("https://google.com");
speak("Apro Google");
return;
}

if(t.includes("youtube")){
window.open("https://youtube.com");
speak("Apro YouTube");
return;
}

if(t.includes("storybook")){
show("storybook");
return;
}

if(t.includes("os")){
openOS();
return;
}

window.open("https://google.com/search?q=" + t);
speak("Cerco " + t);
}

/* START */
window.onload = ()=>{
speak("Benvenuto in Oreste AI");
};

</script>

</body>
</html>
