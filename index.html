<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oreste AI</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1b3a;
color:white;
text-align:center;
}

nav{
background:blue;
padding:15px;
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:15px;
}

nav a{
color:white;
text-decoration:none;
font-weight:bold;
cursor:pointer;
}

.page{display:none;padding:20px;}
.active{display:block;}

.card{
background:blue;
padding:20px;
border-radius:15px;
margin:20px auto;
max-width:500px;
}

.avatar img{
width:150px;
height:150px;
border-radius:50%;
box-shadow:0 0 15px #00f2ff;
}

button{
padding:10px;
border:none;
border-radius:10px;
background:#0071e3;
color:white;
cursor:pointer;
margin:5px;
}

input{
padding:10px;
border-radius:10px;
width:70%;
}
</style>

</head>

<body>

<h1>Oreste AI</h1>

<nav>
<a onclick="show('home')">Home</a>
<a onclick="show('assistant')">Assistente</a>
<a onclick="show('download')">Download</a>
<a onclick="show('features')">Funzioni</a>
</nav>

<!-- HOME -->
<div id="home" class="page active">

<div class="avatar">
<img src="https://i.ibb.co/fzBXJPK1/oreste-ai-avatar.png" alt="Avatar">
</div>

<div class="card">
<h2>Benvenuto in Oreste AI</h2>
<p>Assistente vocale intelligente nel browser</p>
</div>

<div class="card">
<p id="datetime"></p>
</div>

<div class="card">
<h2>Meteo</h2>
<p id="weather">Caricamento meteo...</p>
</div>

</div>

<!-- ASSISTENTE -->
<div id="assistant" class="page">

<div class="avatar">
<img src="https://i.ibb.co/fzBXJPK1/oreste-ai-avatar.png" alt="Avatar">
</div>

<div class="card">

<h2>Assistente vocale</h2>

<p id="status">🟢 Pronto</p>

<input id="input" placeholder="Scrivi comando...">

<br>

<button onclick="run()">Invia</button>
<button onclick="voice()">🎤 Parla</button>

</div>

<div class="card">
<p id="datetime2"></p>
</div>

</div>

<!-- DOWNLOAD -->
<div id="download" class="page">
<div class="card">
<h2>Download</h2>
<button onclick="downloadSmart('chrome')">Chrome</button>
<button onclick="downloadSmart('vlc')">VLC</button>
</div>
</div>

<!-- FEATURES -->
<div id="features" class="page">
<div class="card">
✔ Voice AI<br>
✔ Browser Control<br>
✔ Download smart<br>
✔ Meteo live<br>
✔ Data e ora
</div>
</div>

<script>

let currentPage="home";

/* NAV */
function show(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById(p).classList.add("active");
currentPage=p;
}

/* VOCE */
function speak(text){
const msg=new SpeechSynthesisUtterance(text);
msg.lang="it-IT";
speechSynthesis.cancel();
speechSynthesis.speak(msg);
}

/* ORA + DATA */
function updateDateTime(){
const now = new Date();

const optionsDate = {
weekday:'long',
year:'numeric',
month:'long',
day:'numeric'
};

const date = now.toLocaleDateString("it-IT", optionsDate);
const time = now.toLocaleTimeString("it-IT");

const txt = "📅 " + date + " | ⏰ " + time;

document.getElementById("datetime").innerText = txt;
document.getElementById("datetime2").innerText = txt;
}
setInterval(updateDateTime,1000);

/* METEO */
async function getWeather(){

try{

const url = "https://api.open-meteo.com/v1/forecast?latitude=40.8518&longitude=14.2681&current_weather=true";

const res = await fetch(url);
const data = await res.json();

const w = data.current_weather;

let desc="";

if(w.weathercode===0) desc="☀️ Sereno";
else if(w.weathercode<=3) desc="⛅ Poco nuvoloso";
else if(w.weathercode<=48) desc="☁️ Nuvoloso";
else if(w.weathercode<=67) desc="🌧️ Pioggia";
else desc="🌦️ Variabile";

document.getElementById("weather").innerText =
desc + " | 🌡️ " + w.temperature + "°C";

}catch(e){
document.getElementById("weather").innerText="Meteo non disponibile";
}

}

/* MICROFONO */
function voice(){

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(!SpeechRecognition){
speak("Microfono non supportato");
return;
}

const recognition = new SpeechRecognition();
recognition.lang = "it-IT";

document.getElementById("status").innerText="🎤 Ascolto...";

recognition.start();

recognition.onresult=(e)=>{
let text=e.results[0][0].transcript;
document.getElementById("input").value=text;
handle(text);
};

recognition.onend=()=>{
document.getElementById("status").innerText="🟢 Pronto";
};

}

/* INPUT */
function run(){
handle(document.getElementById("input").value);
}

/* DOWNLOAD SMART */
function downloadSmart(text){

text=text.toLowerCase();

if(text.includes("chrome")){
window.open("https://www.google.com/chrome/");
speak("Scarico Chrome");
return;
}

if(text.includes("vlc")){
window.open("https://www.videolan.org/vlc/");
speak("Scarico VLC");
return;
}

window.open("https://www.google.com/search?q="+encodeURIComponent(text+" download"));
speak("Cerco download di "+text);
}

/* ASSISTENTE */
function handle(text){

text=(text||"").toLowerCase().trim();

/* GOOGLE */
if(text.includes("google")){
window.open("https://www.google.com","_blank");
speak("Apro Google");
return;
}

/* APRI */
if(text.startsWith("apri ")){

let site=text.replace("apri ","");

if(!site.includes(".")){
window.open("https://www.google.com/search?q="+encodeURIComponent(site),"_blank");
speak("Cerco "+site);
return;
}

if(!site.startsWith("http")){
site="https://"+site;
}

window.open(site,"_blank");
speak("Apro "+site);
return;
}

/* CERCA */
if(text.startsWith("cerca ") || text.startsWith("trova ")){

let q=text.replace("cerca ","").replace("trova ","");

window.open("https://www.google.com/search?q="+encodeURIComponent(q),"_blank");
speak("Cerco "+q);
return;
}

/* SOCIAL */
if(text.includes("youtube")){
window.open("https://youtube.com","_blank");
speak("Apro YouTube");
return;
}

if(text.includes("tiktok")){
window.open("https://tiktok.com","_blank");
speak("Apro TikTok");
return;
}

if(text.includes("instagram")){
window.open("https://instagram.com","_blank");
speak("Apro Instagram");
return;
}

if(text.includes("canva")){
window.open("https://www.canva.com","_blank");
speak("Apro Canva");
return;
}

/* FALLBACK */
if(text.length>0){
window.open("https://www.google.com/search?q="+encodeURIComponent(text),"_blank");
speak("Cerco su Google");
return;
}

speak("Dimmi un comando");

}

/* START */
window.onload = () => {
updateDateTime();
getWeather();
setTimeout(()=>speak("Benvenuto in Oreste AI"),800);
};

</script>

</body>
</html>
