<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oreste AI + OS</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1b3a;
color:white;
text-align:center;
}

nav{
background:blue;
padding:15px;
display:flex;
justify-content:center;
gap:15px;
}

nav a{
color:white;
text-decoration:none;
font-weight:bold;
cursor:pointer;
}

.page{display:none;padding:20px;}
.active{display:block;}

.card{
background:blue;
padding:20px;
border-radius:15px;
margin:20px auto;
max-width:500px;
}

input{
padding:10px;
border-radius:10px;
width:70%;
}

button{
padding:10px;
border:none;
border-radius:10px;
background:#0071e3;
color:white;
cursor:pointer;
margin:5px;
}

#avatar{
width:140px;
border-radius:50%;
transition:0.2s;
}

.speaking{
box-shadow:0 0 25px #00f2ff;
transform:scale(1.05);
}
</style>
</head>

<body>

<h1>Oreste AI</h1>

<nav>
<a onclick="show('home')">Home</a>
<a onclick="show('assistant')">Assistente</a>
<a onclick="openOS()">Oreste OS</a>
</nav>

<!-- HOME -->
<div id="home" class="page active">

<div class="card">
<img id="avatar" src="https://i.ibb.co/fzBXJPK1/oreste-ai-avatar.png">
<h2>Oreste AI</h2>
<p>Assistente vocale + OS + Browser</p>
</div>

<div class="card">
<p id="datetime"></p>
</div>

</div>

<!-- ASSISTENTE -->
<div id="assistant" class="page">

<div class="card">
<img id="avatar2" src="https://i.ibb.co/fzBXJPK1/oreste-ai-avatar.png" style="width:120px;border-radius:50%;">

<h2>Assistente vocale</h2>

<input id="input" placeholder="Scrivi comando...">
<br>

<button onclick="run()">Invia</button>
<button onclick="voice()">🎤 Parla</button>

<p id="status">🟢 Pronto</p>
</div>

</div>

<!-- OS -->
<div id="os" style="
display:none;
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background:#111;
color:white;
z-index:999;
padding:20px;
">

<h1>Oreste OS</h1>
<button onclick="openBrowser()">🌐 Oreste OS Browser</button>
<button onclick="closeOS()">Chiudi OS</button>
</div>

<!-- BROWSER (SEMPLICE E FUNZIONANTE) -->
<div id="browser" style="
display:none;
position:fixed;
top:120px;
left:50%;
transform:translateX(-50%);
background:blue;
padding:15px;
z-index:1000;
width:90%;
max-width:500px;
border-radius:10px;
">

<h3><img src="logo.svg" width="50" height="50"><br><br><center>Oreste OS Browser</center></h3>

<input id="url" placeholder="google.com">
<button onclick="go()">Apri</button>

<button onclick="closeBrowser()">Chiudi</button>
</div>

<script>

/* NAV */
function show(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById(p).classList.add("active");
}

/* VOCE + AVATAR */
function speak(text){

const avatar = document.getElementById("avatar");
const avatar2 = document.getElementById("avatar2");

const msg = new SpeechSynthesisUtterance(text);
msg.lang = "it-IT";

msg.onstart = () => {
if(avatar) avatar.classList.add("speaking");
if(avatar2) avatar2.classList.add("speaking");
};

msg.onend = () => {
if(avatar) avatar.classList.remove("speaking");
if(avatar2) avatar2.classList.remove("speaking");
};

speechSynthesis.cancel();
speechSynthesis.speak(msg);
}

/* DATA */
setInterval(()=>{
document.getElementById("datetime").innerText =
new Date().toLocaleString("it-IT");
},1000);

/* OS */
function openOS(){
document.getElementById("os").style.display="block";
speak("Apro Oreste OS");
}

function closeOS(){
document.getElementById("os").style.display="none";
}

/* BROWSER (VERSIONE DEFINITIVA) */
function openBrowser(){
document.getElementById("browser").style.display="block";
}

function closeBrowser(){
document.getElementById("browser").style.display="none";
}

function go(){

let url = document.getElementById("url").value.trim();

if(!url){
speak("Inserisci un sito");
return;
}

if(!url.startsWith("http")){
url = "https://" + url;
}

/* SOLUZIONE 100% FUNZIONANTE */
window.open(url, "_blank");

speak("Apro il sito");
}

/* ASSISTENTE */
function run(){
handle(document.getElementById("input").value);
}

function voice(){
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SR){ speak("Microfono non supportato"); return; }

const r = new SR();
r.lang = "it-IT";

document.getElementById("status").innerText="🎤 Ascolto...";

r.start();

r.onresult = (e)=>{
const text = e.results[0][0].transcript;
document.getElementById("input").value = text;
handle(text);
};

r.onend = ()=>{
document.getElementById("status").innerText="🟢 Pronto";
};
}

/* COMANDI */
function handle(text){

text = (text || "").toLowerCase().trim();
if(text.startsWith("apri ")){

let site = text.replace("apri ","").trim();

/* CASI SPECIALI SOCIAL / APP */
if(site.includes("google")){
window.open("https://www.google.com","_blank");
speak("Apro Google");
return;
}

if(site.includes("youtube")){
window.open("https://www.youtube.com","_blank");
speak("Apro YouTube");
return;
}

if(site.includes("canva")){
window.open("https://www.canva.com","_blank");
speak("Apro Canva");
return;
}

if(site.includes("linkedin")){
window.open("https://www.linkedin.com","_blank");
speak("Apro LinkedIn");
return;
}

/* SE NON È URL VALIDO → AGGIUNGE HTTPS SOLO UNA VOLTA */
if(!site.startsWith("http://") && !site.startsWith("https://")){
site = "https://" + site;
}

window.open(site,"_blank");
speak("Apro " + site);
return;
}
if(text.includes("google")){
window.open("https://google.com","_blank");
speak("Apro Google");
return;
}

if(text.includes("youtube")){
window.open("https://youtube.com","_blank");
speak("Apro YouTube");
return;
}

if(text.includes("apri os") || text.includes("oreste os")){
openOS();
return;
}

if(text.includes("browser")){
openBrowser();
speak("Apro il browser");
return;
}

if(text.startsWith("apri ")){
let site = text.replace("apri ","");
if(!site.startsWith("http")) site = "https://" + site;
window.open(site,"_blank");
speak("Apro " + site);
return;
}

if(text.length>0){
window.open("https://google.com/search?q=" + encodeURIComponent(text));
speak("Cerco " + text);
}
}

window.onload = ()=>{
speak("Benvenuto in Oreste AI");
};

</script>

</body>
</html>
